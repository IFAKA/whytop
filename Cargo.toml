[package]
name = "whytop"
version = "0.1.0"
edition = "2021"
description = "Read-only cross-platform process monitor with local AI explanations"
license = "MIT"
repository = "https://github.com/IFAKA/whytop"
homepage = "https://github.com/IFAKA/whytop"
readme = "README.md"
keywords = ["process-monitor", "system-monitor", "terminal", "tui", "local-ai"]
categories = ["command-line-utilities", "os", "visualization"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
crossterm = "0.28"
futures-util = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
